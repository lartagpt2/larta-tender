# NOT ACTIVE: approve with IT, pin each action to a reviewed full commit SHA,
# then move to .github/workflows/ci.yml in a separate reviewed change.
name: Larta Tender checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/.ci-cache/playwright'
      npm_config_cache: '${{ github.workspace }}/.ci-cache/npm'
    steps:
      - uses: actions/checkout@REPLACE_WITH_REVIEWED_COMMIT_SHA
        with:
          persist-credentials: false
      - uses: actions/setup-node@REPLACE_WITH_REVIEWED_COMMIT_SHA
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev
